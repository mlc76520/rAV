# rav-audio: the graph follows the source rate (44.1kHz family by default),
# so hi-res files reach the DAC without resampling; the visualizer's own
# capture stream is converted to 44.1kHz by PipeWire
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
