# rav-audio: headless audio box, PipeWire runs as user mpd (linger)
wireplumber.profiles = {
  main = {
    # No logind seat on a headless box: keep Bluetooth enabled regardless
    monitor.bluez.seat-monitoring = disabled
  }
}

wireplumber.settings = {
  # Output at full scale by default, volume is set per stream (MPD)
  device.routes.default-sink-volume = 1.0
}

# The Pi only receives A2DP from phones
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}

monitor.alsa.rules = [
  # snd-aloop, if still loaded from the old ALSA setup, is not an output
  {
    matches = [ { device.name = "~alsa_card.platform-snd_aloop.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
  # Default output: an I2S DAC (HifiBerry...) when present, else the onboard
  # headphone jack, before HDMI
  {
    matches = [ { node.name = "~alsa_output.platform-soc_sound.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-bcm2835_audio.*" } ]
    actions = { update-props = { priority.session = 1500, priority.driver = 1500 } }
  }
]
