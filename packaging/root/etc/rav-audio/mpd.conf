# MPD configuration for rav-audio (used instead of /etc/mpd.conf via
# MPDCONF, see /usr/lib/systemd/system/mpd.service.d/rav-audio.conf).
#
# The library is set in /etc/rav-audio/mpd_local.conf, created on first
# install and never overwritten by the package:
#   music_directory "/var/lib/mpd/music"         a local folder
#   music_directory "nfs://server/path/to/music" read by MPD itself; the
#       export must allow the client by address (prefer the server's IPv4
#       address if its name also resolves to IPv6) and have "insecure":
#       MPD does not connect from a privileged port
# Playlist files in the library's playlists/ folder (web radios...) are
# listed with the stored playlists. Other local additions go there too.

# Playlists saved by MPD clients: must be local
playlist_directory	"/var/lib/mpd/playlists"
db_file			"/var/lib/mpd/tag_cache"
state_file		"/var/lib/mpd/state"
sticker_file		"/var/lib/mpd/sticker.sql"
user			"mpd"
# All interfaces: the box is driven by MPD clients on the network
bind_to_address		"::"
filesystem_charset	"UTF-8"

input {
	plugin "curl"
}

decoder {
	plugin	"hybrid_dsd"
	enabled	"no"
}

decoder {
	plugin	"wildmidi"
	enabled	"no"
}

# PipeWire (running as user mpd) follows the source rate; the volume is the
# PipeWire stream volume
audio_output {
	type	"pipewire"
	name	"pipewire"
}

include_optional "mpd_local.conf"
