# MPD configuration for rav-audio (used instead of /etc/mpd.conf via
# MPDCONF, see /usr/lib/systemd/system/mpd.service.d/rav-audio.conf).
# Local additions can go in /etc/rav-audio/mpd_local.conf.

music_directory		"/media/icarus3/music"
playlist_directory	"/media/icarus3/music/playlists"
db_file			"/var/lib/mpd/tag_cache"
state_file		"/var/lib/mpd/state"
sticker_file		"/var/lib/mpd/sticker.sql"
user			"mpd"
bind_to_address		"localhost"
filesystem_charset	"UTF-8"

input {
	plugin "curl"
}

decoder {
	plugin	"hybrid_dsd"
	enabled	"no"
}

decoder {
	plugin	"wildmidi"
	enabled	"no"
}

# PipeWire (running as user mpd) resamples to the 44.1kHz graph; the
# volume is the PipeWire stream volume
audio_output {
	type	"pipewire"
	name	"pipewire"
}

include_optional "mpd_local.conf"
