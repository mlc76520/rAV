# rav-audio visualizer settings. Restart after a change:
#   sudo systemctl restart audio-visualizer

# The OLED panels on this box:
#   ssd1309  2x 128x64 monochrome (SalonRPI, Raspberry Pi 3)
#   ssd1322  2x 240x128 greyscale (Raspberry Pi 5). Its font, FreePixel.ttf,
#            is not shipped: put it in /usr/local/share/rav-audio/ (else
#            DejaVu Sans is used).
display = ssd1309
