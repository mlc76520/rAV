[package]
name = "rav-visualizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Dual SSD1309 OLED audio visualizer for the Raspberry Pi (Rust port of rav_unified.cpp)"

[dependencies]
anyhow = "1.0.104"
freetype-rs = "0.38.0"
gpiocdev = "0.8.0"
libc = "0.2.190"
pipewire = "0.10.1"
rustfft = "6.4.1"
spidev = "0.7.1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
